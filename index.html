<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WhichPeak: name every mountain on the horizon</title>
    <meta
      name="description"
      content="Free, open peak finder. A labeled 360 degree panorama from real terrain data, with earth curvature, a line of sight tool and photo alignment. Runs in your browser."
    />
    <meta name="theme-color" content="#0a1220" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta property="og:title" content="WhichPeak" />
    <meta
      property="og:description"
      content="Name every mountain on the horizon from real terrain data."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arthur031221.github.io/WhichPeak/" />
    <meta property="og:image" content="https://arthur031221.github.io/WhichPeak/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const saved = localStorage.getItem("whichpeak.theme");
        const theme =
          saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <header class="bar">
        <a class="brand" href="./" aria-label="WhichPeak">
          <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
            <path class="brand-back" d="M2 25 12 9l6 9 3-4 9 11z" />
            <path class="brand-front" d="M2 25 12 9l5 8-4 3-3-3-3 4z" />
            <circle class="brand-sun" cx="24" cy="9" r="3" />
          </svg>
          <span class="brand-name">WhichPeak</span>
        </a>
        <form class="search" role="search" id="search-form" autocomplete="off">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <circle
              cx="8.5"
              cy="8.5"
              r="5.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="m13 13 4.5 4.5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <input
            id="search-input"
            type="search"
            data-i18n-placeholder="search.placeholder"
            data-i18n-label="search.label"
          />
          <ul id="search-results" class="results" hidden></ul>
        </form>
        <div class="bar-actions">
          <button
            class="icon-btn"
            id="btn-locate"
            type="button"
            data-i18n-title="actions.locate"
            data-i18n-label="actions.locate"
          >
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
              <circle cx="10" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path
                d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btn-compass"
            type="button"
            aria-pressed="false"
            hidden
            data-i18n-title="actions.compass"
            data-i18n-label="actions.compass"
          >
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
              <circle
                cx="10"
                cy="10"
                r="7.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path d="M12.8 7.2 11.2 11.2 7.2 12.8 8.8 8.8Z" fill="currentColor" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btn-share"
            type="button"
            data-i18n-title="actions.share"
            data-i18n-label="actions.share"
          >
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
              <path
                d="M8 12a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1M12 8a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btn-theme"
            type="button"
            data-i18n-title="actions.theme"
            data-i18n-label="actions.theme"
          >
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
              <path
                d="M16.5 11.5A7 7 0 0 1 8.5 3.5a7 7 0 1 0 8 8Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <label class="lang">
            <span class="sr-only" data-i18n="language.label"></span>
            <select id="lang-select"></select>
          </label>
        </div>
      </header>

      <main class="layout">
        <section class="stage" aria-live="polite">
          <div id="panorama-host" class="panorama-host"></div>
          <div class="stage-top">
            <div class="chip" id="place-chip"></div>
            <div class="chip chip-quiet" id="status-chip" hidden></div>
          </div>
          <div class="progress" id="progress" hidden><span></span></div>
          <div class="hint" id="hint" data-i18n="hint.drag"></div>
          <div class="zoom">
            <button class="icon-btn" id="zoom-in" type="button" data-i18n-label="actions.zoomIn">
              +
            </button>
            <button class="icon-btn" id="zoom-out" type="button" data-i18n-label="actions.zoomOut">
              &minus;
            </button>
          </div>
          <article class="card" id="peak-card" hidden></article>
          <div class="photo-stage" id="photo-stage" hidden></div>
          <div class="empty" id="empty" hidden></div>
        </section>

        <aside class="panel" aria-label="Controls">
          <div class="tabs" role="tablist">
            <button
              role="tab"
              id="tab-panorama"
              aria-controls="pane-panorama"
              data-mode="panorama"
              data-i18n="tabs.panorama"
            ></button>
            <button
              role="tab"
              id="tab-los"
              aria-controls="pane-los"
              data-mode="los"
              data-i18n="tabs.los"
            ></button>
            <button
              role="tab"
              id="tab-photo"
              aria-controls="pane-photo"
              data-mode="photo"
              data-i18n="tabs.photo"
            ></button>
          </div>

          <div id="map" class="map" role="application" data-i18n-label="map.label"></div>
          <p class="map-note" data-i18n="map.note"></p>

          <div class="pane" id="pane-panorama" role="tabpanel" aria-labelledby="tab-panorama"></div>
          <div class="pane" id="pane-los" role="tabpanel" aria-labelledby="tab-los" hidden></div>
          <div
            class="pane"
            id="pane-photo"
            role="tabpanel"
            aria-labelledby="tab-photo"
            hidden
          ></div>

          <footer class="foot">
            <span data-i18n="footer.data"></span>
            <a href="https://github.com/Arthur031221/WhichPeak" rel="noopener">GitHub</a>
          </footer>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
